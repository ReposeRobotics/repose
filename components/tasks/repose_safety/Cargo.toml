[package]
name = "repose-safety"
description = "Real-time Physical AI and trajectory execution safety shield task for copper-rs: virtual workspace fences, collision checking, and braking lookahead"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["control", "manipulation", "safety"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
cu-spatial-payloads = { workspace = true }
cu29 = { workspace = true }
libm = { workspace = true }
repose-collision = { version = "0.10.0", path = "../../libs/repose_collision", default-features = false }
repose-kinematics = { version = "0.10.0", path = "../../libs/repose_kinematics", default-features = false }
repose-trajectory = { version = "0.10.0", path = "../../libs/repose_trajectory", default-features = false }
serde = { workspace = true }

[dev-dependencies]
ron = "0.12"

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-kinematics/std",
  "repose-collision/std",
  "repose-trajectory/std",
  "bincode/std",
  "serde/std",
]

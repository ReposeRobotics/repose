[package]
name = "repose-policy-rl"
description = "ONNX reinforcement-learning policy execution task for copper-rs: joint state and goal in, logged observation and raw action out"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["algorithm/policy", "control"]
environments = ["host"]

[dependencies]
bincode = { workspace = true }
repose-kinematics = { version = "0.8.4", path = "../../libs/repose_kinematics", default-features = false }
cu29 = { workspace = true }
serde = { workspace = true }
tract-onnx = "0.23.10"

[dev-dependencies]
ron = "0.12"

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-kinematics/std",
  "bincode/std",
  "serde/std",
]

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run PR gate
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --features std -- --deny warnings
          cargo clippy --workspace --lib --no-default-features -- --deny warnings
          cargo nextest run --workspace --features std
          cargo nextest run --workspace --no-default-features
          cargo test --workspace --doc --features std

  semver-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs the release tags as baseline
      # Breaks are allowed when CHANGELOG.md lists them under Unreleased (see justfile).
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks,just
      - name: Check SemVer against the latest release tag
        run: just semver-check

  # Every scenario must print the same hashes in separate processes (see `just determinism`).
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run determinism check
        run: just determinism

  # Library crates must build with no operating system (see `just bare-metal`).
  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none, thumbv7em-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build for bare-metal targets
        run: just bare-metal

  # Builds the same surface as `just bare-metal` with the Ferrocene compiler,
  # qualified for IEC 61508 / ISO 26262 (see docs/regulatory-positioning).
  # Needs a CriticalUp token from the Ferrocene Customer Portal in the
  # CRITICALUP_TOKEN repository secret; skips when it is not set.
  ferrocene:
    runs-on: ubuntu-latest
    env:
      CRITICALUP_TOKEN: ${{ secrets.CRITICALUP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no CriticalUp token
        if: env.CRITICALUP_TOKEN == ''
        run: echo "::notice::CRITICALUP_TOKEN is not set; skipping the Ferrocene lane"
      - name: Install CriticalUp
        if: env.CRITICALUP_TOKEN != ''
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/ferrocene/criticalup/releases/latest/download/criticalup-installer.sh | sh
      - name: Authenticate CriticalUp
        if: env.CRITICALUP_TOKEN != ''
        run: |
          export PATH="$HOME/.criticalup/bin:$PATH"
          criticalup auth set "$CRITICALUP_TOKEN"
      - name: Install Ferrocene toolchain from criticalup.toml
        if: env.CRITICALUP_TOKEN != ''
        run: |
          export PATH="$HOME/.criticalup/bin:$PATH"
          criticalup install
      - name: Build for bare-metal targets with Ferrocene
        if: env.CRITICALUP_TOKEN != ''
        run: |
          export PATH="$HOME/.criticalup/bin:$PATH"
          criticalup run cargo build --workspace --lib --no-default-features --exclude repose-mujoco-sim \
            --target aarch64-unknown-none \
            --target thumbv7em-none-eabihf

name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Audit Cargo.lock against the RustSec advisory database
        uses: rustsec/audit-check@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

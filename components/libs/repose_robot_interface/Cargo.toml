[package]
name = "repose-robot-interface"
description = "Vendor-neutral robot bridge contract for copper-rs: session commands, session state, and a shared session tracker"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "lib"
domains = ["robotics/interface"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
cu29 = { workspace = true }
serde = { workspace = true }

[features]
default = ["std"]
std = ["cu29/std", "bincode/std", "serde/std"]

[dev-dependencies]
ron = "0.12"

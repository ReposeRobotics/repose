name: Benchmarks (wall-clock)

# Wall-clock numbers on shared runners are noisy, so this is for
# cross-machine comparison, not per-PR regression detection (that is the
# CodSpeed simulation workflow). Runs weekly and on demand; results are
# published as benchmarks.json on the `benchmark-data` branch, which
# getrepose.dev/benchmarks graphs. Public repo: GitHub-hosted standard
# runners are free and unlimited.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: macos-arm64
            os: macos-latest
          - label: macos-x64
            os: macos-15-intel
          - label: windows-x64
            os: windows-latest
          - label: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System info
        shell: bash
        run: |
          cpu=""
          case "$RUNNER_OS" in
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true) ;;
            Linux) cpu=$(grep -m1 -iE "model name|^model" /proc/cpuinfo 2>/dev/null | cut -d: -f2- || true); [ -z "$(echo "$cpu" | tr -d ' ')" ] && cpu=$(lscpu 2>/dev/null | grep -m1 "Model name" | cut -d: -f2- || true) ;;
            Windows) cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name" 2>/dev/null || true) ;;
          esac
          {
            echo "label: ${{ matrix.label }}"
            echo "os: ${{ matrix.os }}"
            echo "uname: $(uname -a 2>/dev/null || echo unknown)"
            echo "arch: $(uname -m 2>/dev/null || echo unknown)"
            echo "cpu: $(echo "$cpu" | sed 's/^ *//')"
            echo "rustc: $(rustc -vV | head -1)"
          } | tee system-info-${{ matrix.label }}.txt
      - name: Run benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p repose 2>&1 | tee bench-${{ matrix.label }}.txt
      - name: Convert to JSON
        shell: bash
        run: |
          version=$(grep -A5 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          python3 .github/scripts/bench_to_json.py \
            bench-${{ matrix.label }}.txt \
            system-info-${{ matrix.label }}.txt \
            benchmarks-${{ matrix.label }}.json \
            --label "${{ matrix.label }}" \
            --commit "${{ github.sha }}" \
            --version "$version" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Benchmarks · ${{ matrix.label }} (\`${{ matrix.os }}\`)"
            echo ""
            echo '```text'
            cat system-info-${{ matrix.label }}.txt
            echo '```'
            echo ""
            echo '```text'
            cat bench-${{ matrix.label }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.label }}
          path: |
            system-info-${{ matrix.label }}.txt
            bench-${{ matrix.label }}.txt
            benchmarks-${{ matrix.label }}.json
          retention-days: 14

  publish:
    name: Publish benchmarks.json
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download per-system results
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
      - name: Merge into benchmarks.json
        run: python3 .github/scripts/merge_benchmarks.py benchmarks.json benchmarks-*.json
      - name: Push to benchmark-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cd publish
          git init -b benchmark-data -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin benchmark-data 2>/dev/null; then
            git checkout -q -b benchmark-data origin/benchmark-data
          fi
          cp ../benchmarks.json benchmarks.json
          git add benchmarks.json
          if git diff --cached --quiet; then
            echo "benchmarks.json unchanged"
          else
            git commit -qm "benchmarks: ${{ github.sha }}"
            git push -q origin benchmark-data
          fi
      - name: Upload merged benchmarks.json
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-json
          path: benchmarks.json
          retention-days: 14

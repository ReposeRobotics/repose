[workspace]

[package]
name = "simplex-safety-demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "simplex_safety_demo"
path = "src/main.rs"

[[bin]]
name = "simplex_safety_triage"
path = "src/triage.rs"

[[bin]]
name = "simplex_safety_resim"
path = "src/resim.rs"

[[bin]]
name = "simplex_safety_logreader"
path = "src/logreader.rs"

[dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["std", "units"] }
cu29-export = "1.3.0"
cu29-unifiedlog = "1.3.1"
cu-rng = "1.3.0"
cu-spatial-payloads = "1.3.0"
repose-collision = { path = "../../components/libs/repose_collision" }
repose-controller = { path = "../../components/tasks/repose_controller" }
repose-incident = { path = "../../components/libs/repose_incident" }
repose-joint-rrt-star = { path = "../../components/tasks/repose_joint_rrt_star" }
repose-kinematics = { path = "../../components/libs/repose_kinematics" }
repose-motion-planning = { path = "../../components/tasks/repose_motion_planning" }
repose-policy-rl = { path = "../../components/tasks/repose_policy_rl" }
repose-safety = { path = "../../components/tasks/repose_safety" }
repose-trajectory = { path = "../../components/libs/repose_trajectory" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"

[build-dependencies]
cu29-build = "1.3.0"

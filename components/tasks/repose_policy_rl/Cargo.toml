[package]
name = "repose-policy-rl"
description = "ONNX reinforcement-learning policy execution task for copper-rs: task-specific observation in, logged model input and raw action out, plus a joint-reach observation task"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["algorithm/policy", "control"]
environments = ["host"]

[dependencies]
bincode = { workspace = true }
repose-kinematics = { version = "0.10.0", path = "../../libs/repose_kinematics", default-features = false }
repose-trajectory = { version = "0.10.0", path = "../../libs/repose_trajectory", default-features = false }
repose-io = { version = "0.10.0", path = "../repose_io", default-features = false }
cu29 = { workspace = true }
serde = { workspace = true }
tract-onnx = "0.23.10"

[dev-dependencies]
cu-spatial-payloads = { workspace = true }
repose-controller = { version = "0.10.0", path = "../repose_controller", default-features = false }
ron = "0.12"

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-kinematics/std",
  "repose-trajectory/std",
  "repose-io/std",
  "bincode/std",
  "serde/std",
]

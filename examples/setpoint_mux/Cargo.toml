[workspace]

[package]
name = "setpoint-mux-demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "setpoint_mux_demo"
path = "src/main.rs"

[[bin]]
name = "setpoint_mux_logreader"
path = "src/logreader.rs"

[[bin]]
name = "setpoint_mux_resim"
path = "src/resim.rs"

[[bin]]
name = "setpoint_mux_to_rrd"
path = "src/to_rrd.rs"
required-features = ["rrd"]

[features]
# Builds src/to_rrd.rs (Copper log -> Rerun); off by default to keep the demo's build small.
rrd = ["dep:rerun", "dep:cu-spatial-payloads"]

[dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["std", "units"] }
cu29-export = "1.3.0"
cu29-unifiedlog = "1.3.1"
cu-rng = "1.3.0"
repose-controller = { path = "../../components/tasks/repose_controller" }
repose-kinematics = { path = "../../components/libs/repose_kinematics" }
repose-trajectory = { path = "../../components/libs/repose_trajectory" }
repose-joint-rrt-star = { path = "../../components/tasks/repose_joint_rrt_star" }
repose-motion-planning = { path = "../../components/tasks/repose_motion_planning" }
repose-policy-rl = { path = "../../components/tasks/repose_policy_rl" }
# Only for `cargo run --features rrd --bin setpoint_mux_to_rrd`.
cu-spatial-payloads = { version = "1.3.0", optional = true }
rerun = { version = "0.43.2", default-features = false, features = ["sdk"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[build-dependencies]
cu29-build = "1.3.0"
